<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Portal</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dfe3e8;--ac:#1d4ed8;--ok:#15803d;--wa:#b45309;--bad:#b91c1c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#181d24;--tx:#e8eaed;--mu:#98a2b3;--bd:#2a313b;--ac:#7aa2ff;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:12px 0}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.r{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
button{width:auto;cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.kv div{font-size:14px;word-break:break-word}.kv b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.q{padding:10px 0;border-top:1px solid var(--bd)}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sc button{padding:4px 11px;min-width:38px}
.sc button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}.sc button.sk.on{background:var(--mu);border-color:var(--mu)}
.sec{font-weight:600;margin:16px 0 2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.big{font-size:36px;font-weight:700;line-height:1.1}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.sticky{position:sticky;top:0;z-index:5}
#msg{font-size:13px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
.sx{overflow-x:auto}.hide{display:none}
</style></head><body><div class="w">

<div id="login" class="c hide"><h2>Sign in</h2><label>Portal password</label>
<div class="bar" style="justify-content:flex-start"><input id="pw" type="password" style="max-width:260px"><button class="p" id="go">Open portal</button></div></div>

<div id="app" class="hide">
<div class="bar"><div><h1>Interview Portal</h1><div class="mu">Pick a position and candidate, score the questions, save the result to Google Sheets.</div></div>
<button id="setup">Set up sheet</button></div>
<div id="msg" class="mu"></div>

<div class="c"><h2>Candidate</h2>
<div class="r"><div><label>Position</label><select id="pos"></select></div><div><label>Candidate</label><select id="cand"></select></div></div>
<div class="r" style="margin-top:10px"><div><label>Interviewer</label><input id="ivr" placeholder="e.g. VRS"></div><div style="align-self:end"><button id="reload">Reload from sheet</button></div></div></div>

<div id="det"></div><div id="qs"></div><div id="fin"></div>
<div class="c"><h2>Saved interviews</h2><div class="sx" id="hist"></div></div>
</div>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=(t,c)=>{$("msg").textContent=t;$("msg").className=c||"mu"};
const pwd=()=>sessionStorage.getItem("pw")||"";
async function api(path,opt={}){
  const r=await fetch("/api/"+path,{...opt,headers:{"Content-Type":"application/json","x-app-password":pwd()}});
  const j=await r.json().catch(()=>({error:"Bad response"}));
  if(r.status===401){sessionStorage.removeItem("pw");$("app").classList.add("hide");$("login").classList.remove("hide");throw new Error("Wrong password")}
  if(!r.ok)throw new Error(j.error||"Request failed");return j}
const z=n=>String(n).padStart(2,"0");
const stamp=d=>`${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;

let H=[],rows=[],ci={n:1,p:2},hist=[],cur=null,Q=[],S={},tm=null;
const posOf=r=>(r[ci.p]||"").trim();

async function load(){
  try{
    msg("Loading from Google Sheets…");
    const c=await api("candidates");H=c.headers;rows=c.rows;
    const f=re=>H.findIndex(h=>re.test(h||""));
    ci.n=f(/name/i)>=0?f(/name/i):1;ci.p=f(/position|post|role|apply|job/i);if(ci.p<0)ci.p=2;
    hist=(await api("interviews")).rows;
    fillPos();renderHist();
    msg(`${rows.length} candidate(s) loaded from “${c.tab}”.`,"ok");
  }catch(e){msg(e.message,"bad")}
}
function fillPos(){const ps=[...new Set(rows.map(posOf).filter(Boolean))].sort();
  $("pos").innerHTML='<option value="">Select position</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join("");fillCand()}
function fillCand(){const p=$("pos").value;
  const l=rows.map((r,i)=>({r,i})).filter(o=>p&&posOf(o.r)===p);
  $("cand").innerHTML=`<option value="">${p?"Select candidate":"Select a position first"}</option>`+l.map(o=>{
    const done=hist.some(h=>h[1]===o.r[ci.n]&&h[2]===p);return `<option value="${o.i}">${esc(o.r[ci.n])}${done?" (interviewed)":""}</option>`}).join("");pick()}
async function pick(){
  clearInterval(tm);$("fin").innerHTML="";S={};Q=[];cur=null;
  const i=$("cand").value;if(i===""){$("det").innerHTML="";$("qs").innerHTML="";return}
  const r=rows[+i];cur={row:r,name:r[ci.n],pos:posOf(r),start:null,end:null,done:false};
  $("det").innerHTML=`<div class="c"><h2>${esc(cur.name)}: form details</h2><div class="kv">${H.map((h,k)=>r[k]?`<div><b>${esc(h)}</b>${esc(r[k])}</div>`:"").join("")}</div></div>`;
  $("qs").innerHTML='<div class="c mu">Loading questions…</div>';
  try{const q=await api("questions?position="+encodeURIComponent(cur.pos));
    if(!q.questions.length){$("qs").innerHTML=`<div class="c bad">${esc(q.error||"No questions found for this position.")}</div>`;return}
    Q=q.questions;cur.tab=q.tab;renderQs()}catch(e){$("qs").innerHTML=`<div class="c bad">${esc(e.message)}</div>`}
}
function renderQs(){
  let sec="",h="";
  Q.forEach(q=>{if(q.section!==sec){sec=q.section;h+=`<div class="sec">${esc(sec)}</div>`}
    h+=`<div class="q"><div>${esc(q.text)}</div><div class="sc" data-id="${q.id}">${Array.from({length:q.max+1},(_,n)=>`<button data-v="${n}">${n}</button>`).join("")}<button class="sk on" data-v="">Not asked</button></div></div>`});
  $("qs").innerHTML=`<div class="c sticky"><div class="bar"><div><b>Interview: ${esc(cur.name)}</b><div class="mu">${esc(cur.pos)}, ${Q.length} questions from tab “${esc(cur.tab)}”</div></div>
  <div><span id="clk" class="mu">Not started</span> <button class="p" id="st">Start interview</button></div></div></div>
  <div class="c">${h}<div style="margin-top:14px"><label>Interviewer notes (++ strengths, -- weaknesses)</label><textarea id="nt" rows="4"></textarea></div>
  <div style="margin-top:12px"><button class="p" id="fn" disabled>Finish interview and show score</button></div></div>`}
function stats(){let t=0,n=0,mx=0;Q.forEach(q=>{if(S[q.id]!==undefined){t+=S[q.id];mx+=q.max;n++}});return{t,n,mx,pct:mx?Math.round(t/mx*100):0}}
const suggest=p=>p>=70?"Selected for next round":p>=50?"On hold / Called for trial":"Rejected";
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!cur)return;
  if(b.parentElement.classList.contains("sc")){if(cur.done)return;const id=b.parentElement.dataset.id;
    if(b.dataset.v==="")delete S[id];else S[id]=+b.dataset.v;
    [...b.parentElement.children].forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.id==="st"){cur.start=new Date();b.disabled=true;b.textContent="In progress";$("fn").disabled=false;
    tm=setInterval(()=>{const s=Math.floor((new Date()-cur.start)/1000);$("clk").textContent=`Started ${stamp(cur.start).slice(11)}, ${Math.floor(s/60)}m ${s%60}s`},1000)}
  if(b.id==="fn"){cur.end=new Date();cur.done=true;clearInterval(tm);b.disabled=true;finish()}
  if(b.id==="sv")save();
});
function finish(){
  const s=stats(),mins=Math.round((cur.end-cur.start)/60000),sg=suggest(s.pct),cl=s.pct>=70?"ok":s.pct>=50?"wa":"bad";
  cur.res={s,mins};
  $("fin").innerHTML=`<div class="c"><h2>Final score</h2><div class="bar"><div><div class="big ${cl}">${s.t} / ${s.mx}</div>
  <div class="mu">${s.pct}% on ${s.n} of ${Q.length} questions asked. Duration ${mins} min (${stamp(cur.start)} to ${stamp(cur.end).slice(11)})</div></div>
  <div><label>Decision</label><select id="dc">${["Selected for next round","On hold / Called for trial","Rejected","Can be trained / entry level"].map(o=>`<option ${o===sg?"selected":""}>${o}</option>`).join("")}</select></div></div>
  <div style="margin-top:12px"><button class="p" id="sv">Save to Google Sheet</button> <span id="svm" class="mu"></span></div></div>`;
  $("fin").scrollIntoView({behavior:"smooth"})}
async function save(){
  const s=cur.res.s,body={savedAt:stamp(new Date()),candidate:cur.name,position:cur.pos,interviewer:$("ivr").value,start:stamp(cur.start),end:stamp(cur.end),minutes:cur.res.mins,total:s.t,maxAsked:s.mx,percent:s.pct+"%",asked:s.n,decision:$("dc").value,notes:$("nt").value,scores:S};
  $("sv").disabled=true;$("svm").textContent="Saving…";
  try{await api("interviews",{method:"POST",body:JSON.stringify(body)});$("svm").textContent="Saved to the Interviews tab.";$("svm").className="ok";
    hist.push([body.savedAt,body.candidate,body.position,body.interviewer,body.start,body.end,body.minutes,body.total,body.maxAsked,body.percent,body.asked,body.decision]);renderHist()}
  catch(e){$("svm").textContent="Save failed: "+e.message;$("svm").className="bad";$("sv").disabled=false}}
function renderHist(){
  $("hist").innerHTML=hist.length?`<table><tr><th>Saved</th><th>Candidate</th><th>Position</th><th>Score</th><th>%</th><th>Decision</th></tr>${hist.slice().reverse().slice(0,40).map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td><td>${esc(h[2])}</td><td>${esc(h[7])}/${esc(h[8])}</td><td>${esc(h[9])}</td><td>${esc(h[11])}</td></tr>`).join("")}</table>`:'<span class="mu">No interviews saved yet.</span>'}
$("setup").onclick=async()=>{try{msg("Setting up…");const r=await api("setup",{method:"POST"});msg(r.created.length?"Created tabs: "+r.created.join(", "):"Sheet already set up.","ok");load()}catch(e){msg(e.message,"bad")}};
$("pos").onchange=fillCand;$("cand").onchange=pick;$("reload").onclick=load;
$("ivr").value=localStorage.getItem("ivr")||"";$("ivr").onchange=()=>localStorage.setItem("ivr",$("ivr").value);
$("go").onclick=()=>{sessionStorage.setItem("pw",$("pw").value);start()};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
function start(){$("login").classList.add("hide");$("app").classList.remove("hide");load()}
(async()=>{try{await api("questions");start()}catch(e){if(e.message==="Wrong password"){$("login").classList.remove("hide")}else start()}})();
</script></div></body></html>
